name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Verify VirtualDesktopAccessor
        shell: pwsh
        run: ./scripts/update-vda.ps1 -Verify

      # src/AgentHud.Core/Strings.tsv is the single source; SwiftPM can't reference files
      # outside the package, so the macOS table is a byte-identical copy.
      - name: Verify shared strings table
        shell: bash
        run: git diff --no-index --exit-code src/AgentHud.Core/Strings.tsv src/AgentHud.macOS/AgentHud/Resources/Strings.tsv

      - name: Restore
        run: dotnet restore AgentHud.sln

      - name: Build
        run: dotnet build AgentHud.sln -c Release --no-restore

      - name: Registry checks
        run: dotnet run --project tests/AgentHud.Tests/AgentHud.Tests.csproj -c Release

  macos:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7

      - name: Build app bundle
        run: bash scripts/build_app.sh

      - name: Discovery regression tests
        run: swift test --package-path src/AgentHud.macOS

      - name: Verify app bundle
        run: |
          app=src/AgentHud.macOS/dist/AgentHud.app
          test -x "$app/Contents/MacOS/AgentHud"
          test -d "$app/Contents/Resources/AgentHud_AgentHud.bundle"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
