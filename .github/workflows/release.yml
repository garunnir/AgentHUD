name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Verify VirtualDesktopAccessor
        shell: pwsh
        run: ./scripts/update-vda.ps1 -Verify

      - name: Registry checks
        run: dotnet run --project tests/AgentHud.Tests/AgentHud.Tests.csproj -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $common = @('src/AgentHud/AgentHud.csproj', '-c', 'Release', '-r', 'win-x64', '-p:PublishSingleFile=true', '-p:DebugType=none', "-p:Version=$version")
          dotnet publish @common --self-contained false -p:UpdateAsset=win-x64.zip -o publish/fd
          dotnet publish @common --self-contained true -p:UpdateAsset=win-x64-self-contained.zip -o publish/sc
          foreach ($dir in 'publish/fd', 'publish/sc') { Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md $dir }
          Compress-Archive publish/fd/* "AgentHud-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive publish/sc/* "AgentHud-${{ github.ref_name }}-win-x64-self-contained.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: AgentHud-${{ github.ref_name }}-win-*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7

      - name: Build app bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: VERSION="${RELEASE_TAG#v}" bash scripts/build_app.sh

      - name: Verify app bundle
        run: |
          app=src/AgentHud.macOS/dist/AgentHud.app
          test -x "$app/Contents/MacOS/AgentHud"
          test -d "$app/Contents/Resources/AgentHud_AgentHud.bundle"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          expected_arch='${{ matrix.arch }}'
          if [ "$expected_arch" = x64 ]; then expected_arch=x86_64; fi
          lipo "$app/Contents/MacOS/AgentHud" -verify_arch "$expected_arch"

      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            src/AgentHud.macOS/dist/AgentHud.app \
            "AgentHud-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: AgentHud-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            > [!WARNING]
            > 실험용(Experimental) 빌드입니다. 기능이 불안정하거나 예고 없이 변경될 수 있습니다.
            > Experimental build. Features may be unstable or change without notice.

            ### 다운로드 및 실행

            | 파일 | 설명 |
            | --- | --- |
            | `AgentHud-${{ github.ref_name }}-win-x64.zip` | [.NET 9 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/9.0) 필요 |
            | `AgentHud-${{ github.ref_name }}-win-x64-self-contained.zip` | 런타임 포함, 설치 없이 실행 |
            | `AgentHud-${{ github.ref_name }}-macos-arm64.zip` | macOS 14+, Apple Silicon |
            | `AgentHud-${{ github.ref_name }}-macos-x64.zip` | macOS 14+, Intel |

            macOS: Extract the ZIP and move `AgentHud.app` to Applications. The app is ad-hoc signed without Apple notarization; allow the first launch in System Settings > Privacy & Security if prompted.

            압축을 풀고 `AgentHud.exe`를 실행하세요. `VirtualDesktopAccessor.dll`은 exe와 같은 폴더에 있어야 합니다. 요구 사항은 README를 참고하세요.
          files: |
            AgentHud-${{ github.ref_name }}-win-x64.zip
            AgentHud-${{ github.ref_name }}-win-x64-self-contained.zip
            AgentHud-${{ github.ref_name }}-macos-arm64.zip
            AgentHud-${{ github.ref_name }}-macos-x64.zip
