name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안해 주세요.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 무엇이 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
  - type: checkboxes
    id: contribute
    attributes:
      label: 기여 의사
      options:
        - label: 직접 PR을 보낼 의향이 있습니다.
